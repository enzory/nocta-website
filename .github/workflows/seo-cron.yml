# ============================================================
# .github/workflows/seo-cron.yml
# Génération automatique de pages GEO pour NOCTA
# ============================================================
# Rythme : 1 fois par semaine (lundi à 03h00 UTC = 05h Paris).
# THROTTLE TEMPORAIRE — réduit de 3x/sem (lun/mer/ven) à lundi seul le temps que
# l'indexation GSC reparte (backlog GEO mince en cours de réécriture/réindexation).
# Rouvrir à 1,3,5 une fois l'indexation stabilisée.
# Peut aussi être déclenché à la main depuis l'onglet Actions.
#
# Flux :
#   1. Checkout repo
#   2. Setup Node 20 + install deps (@anthropic-ai/sdk, yaml)
#   3. Run scripts/seo-auto-generate.mjs
#   4. Garde-fou : build du site + scripts/facts_check.py. Si une page contredit
#      les faits de référence, le job échoue ici et RIEN n'est publié.
#   5. Crée une branche + une PR, QUELLE QUE SOIT la note du brand-check :
#      plus aucun commit direct sur main. La note figure dans le titre de la PR.
#   6. Si status == "empty-queue" ou "error" → log, pas de commit
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   - ANTHROPIC_API_KEY
# ============================================================

name: SEO auto-generate

on:
  schedule:
    # Lundi seul à 03h00 UTC (throttle temporaire — cf. en-tête)
    - cron: "0 3 * * 1"
  workflow_dispatch: # permet le lancement manuel

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          # On s'assure que les deps nécessaires au script sont présentes.
          # @anthropic-ai/sdk et yaml sont dans package.json (cf. setup).
          npm ci

      - name: Run SEO auto-generate
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          RESULT=$(node scripts/seo-auto-generate.mjs 2>&1 | tee /tmp/gen.log | tail -n 1)
          echo "Generation result: $RESULT"
          echo "result=$RESULT" >> $GITHUB_OUTPUT

          # Extrait les champs utiles
          STATUS=$(echo "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).status||"")}catch{}})')
          SLUG=$(echo "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).slug||"")}catch{}})')
          SCORE=$(echo "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).score||"")}catch{}})')
          VERDICT=$(echo "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).verdict||"")}catch{}})')

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "slug=$SLUG"     >> $GITHUB_OUTPUT
          echo "score=$SCORE"   >> $GITHUB_OUTPUT
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT

      # ---------- Garde-fou : cohérence des faits AVANT toute publication ----------
      # Ne tourne que si une page a été générée. facts_check.py lit dist/ et sort en
      # erreur s'il trouve un fait contredit (prix, délai, plateaux-repas…) : l'étape
      # échoue, les étapes de commit / push / PR ci-dessous sont sautées.
      - name: Vérification des faits (build + facts_check)
        if: steps.gen.outputs.status == 'pr-review'
        run: |
          pip install requests beautifulsoup4
          npm run build
          python3 scripts/facts_check.py

      - name: Configure git
        if: steps.gen.outputs.status == 'pr-review'
        run: |
          git config user.name  "nocta-seo-bot"
          git config user.email "seo-bot@noctaparis.fr"

      # ---------- PR pour relecture Enzo (toujours, quelle que soit la note) ----------
      # L'ancien « CAS 1 » (note >= 8 → commit + push direct sur main) est supprimé :
      # aucune page ne part en ligne sans relecture. La note du brand-check est
      # dans le titre de la PR, le verdict et les détails dans sa description.
      - name: Create PR (pr-review)
        if: steps.gen.outputs.status == 'pr-review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="seo/auto-${{ steps.gen.outputs.slug }}"
          git checkout -b "$BRANCH"
          git add src/content/geo/ src/content/geo-queue.yaml
          git commit -m "feat(seo): draft ${{ steps.gen.outputs.slug }} (brand-check ${{ steps.gen.outputs.score }}/10)"
          git push origin "$BRANCH"

          SLUG="${{ steps.gen.outputs.slug }}"
          SCORE="${{ steps.gen.outputs.score }}"
          VERDICT="${{ steps.gen.outputs.verdict }}"
          PR_BODY=$(printf 'Page GEO générée automatiquement. Garde-fou build + facts_check passé.\n\n**Slug** : %s\n**Note brand-check** : %s/10\n**Verdict brand-check** : %s\n\nRelire le draft dans `src/content/geo/%s.md` avant merge (le détail des points relevés est dans le log du job).\n\n---\n_Généré automatiquement par seo-cron._' "$SLUG" "$SCORE" "$VERDICT" "$SLUG")
          # La note apparaît dans le titre : qualité visible d'un coup d'œil dans la liste des PR.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[SEO auto] $SLUG — brand-check $SCORE/10" \
            --body "$PR_BODY"

      # ---------- Log en cas de queue vide ----------
      - name: Empty queue notice
        if: steps.gen.outputs.status == 'empty-queue'
        run: echo "::notice::Queue GEO vide. Ajoute des sujets dans src/content/geo-queue.yaml."

      # ---------- Upload log en artifact si erreur ----------
      - name: Upload log on error
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: seo-gen-log
          path: /tmp/gen.log
          retention-days: 14
